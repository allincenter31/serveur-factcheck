<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    .instructions {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      text-align: center;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      font-size: 13px;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #resultat {
      margin-top: 12px;
      font-size: 13px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      word-wrap: break-word;
    }
    /* Styles selon le verdict */
    .loading { background-color: #e2e8f0; color: #475569; display: block !important; }
    .valide  { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block !important; }
    .douteux { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; display: block !important; }
    .fake    { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block !important; }
    .erreur  { background-color: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; display: block !important; }
  </style>
</head>
<body>
  <h2>FactChecker AI 🕵️</h2>
  <p class="instructions">Surlignez du texte sur la page puis cliquez sur le bouton ci-dessous :</p>
  
  <button id="btn-analyser">Analyser le texte</button>
  
  <div id="resultat"></div>

  <script src="popup.js"></script>
</body>
</html>
